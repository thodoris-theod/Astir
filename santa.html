<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Άγιος Βασίλης στις Καμινάδες</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
:root{--bg:#F6F1EA;--ink:#2B2118;--muted:#7A6A50;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161F;--ink:#EDE9DF;--muted:#9AA3B2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11161F;--ink:#EDE9DF;--muted:#9AA3B2;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;-webkit-user-select:none;user-select:none;touch-action:manipulation}
h1{margin:0;font-size:1.5rem;font-weight:700}
.wrap{width:100%;max-width:900px}
canvas{display:block;width:100%;border-radius:18px;touch-action:none}
p{margin:0;color:var(--muted);font-size:.95rem}
</style>
</head>
<body>
<h1>Άγιος Βασίλης στις Καμινάδες</h1>
<div class="wrap"><canvas id="g"></canvas></div>
<p>Άγγιξε την οθόνη ή πάτα Space για άλμα</p>
<script>
const cv=document.getElementById('g'),ctx=cv.getContext('2d');
const H=300,GY=250,CX=60,CW=44,CH=52;
let W=640,scale=1,state='ready',score=0,best=0,speed=6,obs=[],since=0,gap=400,cy=GY-CH,vy=0,frame=0,last=0,deadAt=0,tm=0;
let stars=[],flakes=[],houses=[];
for(let i=0;i<45;i++)stars.push({x:Math.random()*1200,y:Math.random()*150,r:.6+Math.random()*1.3,p:Math.random()*6});
for(let i=0;i<50;i++)flakes.push({x:Math.random()*1200,y:Math.random()*H,r:1+Math.random()*2,v:.4+Math.random()*.8});

try{best=+localStorage.getItem('santaBest')||0}catch(e){}

function fit(){
  const cw=cv.parentElement.clientWidth;
  const ch=Math.min(cw*0.6,innerHeight*0.65);
  cv.style.height=ch+'px';
  const d=window.devicePixelRatio||1;
  cv.width=Math.round(cw*d);cv.height=Math.round(ch*d);
  scale=ch*d/H;W=cw/ch*H;
}
addEventListener('resize',fit);fit();

function addHouses(){let e=houses.length?houses[houses.length-1].x+houses[houses.length-1].w:-60;while(e<W+500){const gx=e+22,w=220+Math.random()*180;houses.push({x:gx,w});e=gx+w;}}
function reset(){score=0;speed=6;obs=[];since=0;gap=380;cy=GY-CH;vy=0;houses=[{x:-60,w:W+260}];addHouses();}
function act(){
  const now=performance.now();
  if(state==='ready'){reset();state='run';vy=-14;}
  else if(state==='over'){if(now-deadAt>400){reset();state='run';}}
  else if(cy>=GY-CH-1){vy=-14;}
}
addEventListener('pointerdown',act);
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)act();}});

function spawn(){
  const n=score>150&&Math.random()<.35?2:1,total=n*26+(n-1)*14,x0=W+20;
  if(!houses.some(h=>x0-8>=h.x+6&&x0+total+8<=h.x+h.w-6))return false;
  for(let i=0;i<n;i++)obs.push({t:'c',x:x0+i*40,w:26,h:38+Math.random()*16});
  return true;
}
function box(o){return {x:o.x+2,y:GY-o.h-5,w:o.w-4,h:o.h+5};}
function hit(){
  const a={x:CX+9,y:cy+9,w:CW-18,h:CH-13};
  return obs.some(o=>{const b=box(o);return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;});
}
function update(dt){
  flakes.forEach(f=>{f.y+=f.v*dt;f.x-=(state==='run'?speed*.25:.3)*dt;if(f.y>H)f.y=-4;if(f.x<-4)f.x=W+4;});
  if(state!=='run')return;
  speed=Math.min(13,speed+0.0025*dt);
  score+=speed*dt*0.1;
  vy+=0.8*dt;cy+=vy*dt;
  if(cy>=GY-CH){cy=GY-CH;vy=0;}
  frame+=dt*speed*0.04;
  obs.forEach(o=>o.x-=speed*dt);
  obs=obs.filter(o=>o.x>-70);
  houses.forEach(h=>h.x-=speed*dt);houses=houses.filter(h=>h.x+h.w>-30);addHouses();
  since+=speed*dt;
  if(since>=gap&&spawn()){since=0;gap=speed*(28+Math.random()*30)+170;}
  if(hit()){state='over';deadAt=performance.now();
    const s=Math.floor(score);
    if(s>best){best=s;try{localStorage.setItem('santaBest',String(best))}catch(e){}}}
}

function drawSanta(x,y){
  ctx.save();ctx.translate(x,y);
  const air=cy<GY-CH-1,ph=air?0:Math.floor(frame)%2;
  ctx.fillStyle='#8B5E3C';ctx.beginPath();ctx.ellipse(5,37,9,11,0,0,7);ctx.fill();
  ctx.lineCap='round';
  [[14,ph?-4:4],[28,ph?4:-4]].forEach(([lx,o])=>{
    const ox=air?(lx<20?-3:4):o;
    ctx.strokeStyle='#9E1B2E';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(lx,42);ctx.lineTo(lx+ox,48);ctx.stroke();
    ctx.fillStyle='#1E1A18';ctx.beginPath();ctx.ellipse(lx+ox+2,50,6.5,2.8,0,0,7);ctx.fill();});
  ctx.fillStyle='#D7263D';ctx.beginPath();ctx.ellipse(22,34,16,13,0,0,7);ctx.fill();
  ctx.fillStyle='#2B2118';ctx.fillRect(7,35,30,4);
  ctx.fillStyle='#F2C230';ctx.fillRect(19,34,6,6);
  ctx.fillStyle='#B81D32';ctx.beginPath();ctx.ellipse(24,33,6,9,.2,0,7);ctx.fill();
  ctx.fillStyle='#F5C9A0';ctx.beginPath();ctx.arc(30,19,9,0,7);ctx.fill();
  ctx.fillStyle='#FFFFFF';ctx.beginPath();ctx.ellipse(31,27,10,7,0,0,7);ctx.fill();
  ctx.fillStyle='#2B2118';ctx.beginPath();ctx.arc(34,18,1.7,0,7);ctx.fill();
  ctx.fillStyle='#E9967A';ctx.beginPath();ctx.arc(38,21,2.2,0,7);ctx.fill();
  ctx.fillStyle='#D7263D';ctx.beginPath();ctx.moveTo(21,13);ctx.lineTo(27,1);ctx.lineTo(40,7);ctx.lineTo(40,13);ctx.closePath();ctx.fill();
  ctx.fillStyle='#FFFFFF';ctx.fillRect(20,11,22,5);
  ctx.beginPath();ctx.arc(27,2,4,0,7);ctx.fill();
  ctx.restore();
}
function drawHouse(h){
  const x=h.x,w=h.w;
  ctx.fillStyle='#2E3A57';ctx.fillRect(x,GY+22,w,H-GY-22);
  ctx.fillStyle='#FFD66B';
  for(let wx=x+28;wx<x+w-34;wx+=64)ctx.fillRect(wx,GY+29,16,13);
  ctx.fillStyle='#4A2B2B';ctx.fillRect(x-6,GY+8,w+12,14);
  ctx.fillStyle='#6A3D3B';
  for(let r=0;r<2;r++)for(let tx=x-6+(r?8:0);tx<x+w+6;tx+=16)ctx.fillRect(tx,GY+10+r*6,10,3);
  ctx.fillStyle='#EAF1F8';ctx.fillRect(x-6,GY,w+12,8);
  ctx.beginPath();ctx.arc(x-6,GY+4,4,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(x+w+6,GY+4,4,0,7);ctx.fill();
}
function drawObs(o){
  if(o.t==='c'){
    const t=GY-o.h;
    ctx.fillStyle='#B5533C';ctx.fillRect(o.x,t,o.w,o.h+3);
    ctx.strokeStyle='#8F3E2B';ctx.lineWidth=1.5;
    for(let r=t+9;r<GY;r+=9){ctx.beginPath();ctx.moveTo(o.x,r);ctx.lineTo(o.x+o.w,r);ctx.stroke();}
    ctx.fillStyle='#3B2A26';ctx.fillRect(o.x-3,t-6,o.w+6,7);
    ctx.fillStyle='#FFFFFF';ctx.fillRect(o.x-3,t-9,o.w+6,4);
    for(let k=0;k<3;k++){
      const p=((tm*0.03+k*13)%39);
      ctx.fillStyle='rgba(225,230,240,'+(0.55-p/80)+')';
      ctx.beginPath();ctx.arc(o.x+o.w/2+Math.sin(p/6+k)*5,t-14-p,4+p/9,0,7);ctx.fill();
    }
  }else{
    ctx.fillStyle='#7A4A38';
    ctx.beginPath();ctx.moveTo(o.x,GY);ctx.lineTo(o.x+o.w/2,GY-o.h);ctx.lineTo(o.x+o.w,GY);ctx.closePath();ctx.fill();
    ctx.fillStyle='#FFFFFF';
    ctx.beginPath();ctx.moveTo(o.x+o.w*.25,GY-o.h*.5);ctx.lineTo(o.x+o.w/2,GY-o.h);ctx.lineTo(o.x+o.w*.75,GY-o.h*.5);ctx.closePath();ctx.fill();
  }
}

function drawLogo(){
  if(!logoOk)return;
  const h=44,w=h*logoImg.naturalWidth/logoImg.naturalHeight,x=12,y=10,r=8;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();ctx.clip();
  ctx.drawImage(logoImg,x,y,w,h);
  ctx.restore();
}
const pad=n=>String(Math.floor(n)).padStart(5,'0');
function centerText(t,y,size,col){ctx.font='700 '+size+'px Fredoka,system-ui,sans-serif';ctx.textAlign='center';ctx.fillStyle=col;ctx.fillText(t,W/2,y);}

function draw(){
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.fillStyle='#14213D';ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{ctx.fillStyle='rgba(255,255,255,'+(0.5+0.5*Math.sin(tm*.003+s.p))+')';ctx.beginPath();ctx.arc(s.x%W,s.y,s.r,0,7);ctx.fill();});
  ctx.fillStyle='#FFF3C4';ctx.beginPath();ctx.arc(W-70,60,22,0,7);ctx.fill();
  ctx.fillStyle='#14213D';ctx.beginPath();ctx.arc(W-61,54,19,0,7);ctx.fill();
  
  
  houses.forEach(drawHouse);
  obs.forEach(drawObs);
  drawSanta(CX,cy);
  ctx.fillStyle='rgba(255,255,255,.85)';
  flakes.forEach(f=>{ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill();});
  drawLogo();
  ctx.textAlign='right';ctx.font='700 17px Fredoka,system-ui,sans-serif';ctx.fillStyle='#E8EEF7';
  ctx.fillText('Ρεκόρ '+pad(best)+'   Σκορ '+pad(score),W-14,28);
  if(state==='ready')centerText('Άγγιξε για να πηδήξεις',130,26,'#FFFFFF');
  if(state==='over'){
    ctx.fillStyle='rgba(20,33,61,.78)';ctx.fillRect(0,80,W,100);
    centerText('Κόλλησες στην καμινάδα!',122,26,'#FF8A8A');
    centerText('Άγγιξε για να ξαναπαίξεις',156,18,'#E8EEF7');
  }
}
function loop(t){
  const dt=Math.min(2.5,(t-(last||t))/16.667);last=t;tm=t;
  update(dt);draw();requestAnimationFrame(loop);
}
reset();requestAnimationFrame(loop);
