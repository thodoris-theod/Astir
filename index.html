<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Κότα εναντίον Αυγών</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
:root{--bg:#FBF7EA;--ink:#3B2F1E;--muted:#7A6A50;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D2216;--ink:#F1ECD8;--muted:#A9A58C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1D2216;--ink:#F1ECD8;--muted:#A9A58C;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;-webkit-user-select:none;user-select:none;touch-action:manipulation}
h1{margin:0;font-size:1.5rem;font-weight:700;letter-spacing:.2px}
.wrap{width:100%;max-width:900px}
canvas{display:block;width:100%;border-radius:18px;touch-action:none}
p{margin:0;color:var(--muted);font-size:.95rem}
</style>
</head>
<body>
<h1>Κότα εναντίον Αυγών</h1>
<div class="wrap"><canvas id="g"></canvas></div>
<p>Άγγιξε την οθόνη ή πάτα Space για άλμα</p>
<script>
const cv=document.getElementById('g'),ctx=cv.getContext('2d');
const H=300,GY=250,CX=60,CW=44,CH=48;
let W=640,scale=1,state='ready',score=0,best=0,speed=6,eggs=[],since=0,gap=400,cy=GY-CH,vy=0,frame=0,last=0,deadAt=0;
let clouds=[{x:80,y:50,s:1},{x:300,y:90,s:.8},{x:520,y:40,s:1.1},{x:760,y:75,s:.9}];
let tufts=[];for(let i=0;i<30;i++)tufts.push({x:Math.random()*1200,y:GY+16+Math.random()*30});
const COLORS=['#F28DA6','#6FB7E9','#B79CEB','#FFB84D','#7ED3A4'];
try{best=+localStorage.getItem('kotaBest')||0}catch(e){}

function fit(){
  const cw=cv.parentElement.clientWidth;
  const ch=Math.min(cw*0.6,innerHeight*0.65);
  cv.style.height=ch+'px';
  const d=window.devicePixelRatio||1;
  cv.width=Math.round(cw*d);cv.height=Math.round(ch*d);
  scale=ch*d/H;W=cw/ch*H;
}
addEventListener('resize',fit);fit();

function reset(){score=0;speed=6;eggs=[];since=0;gap=380;cy=GY-CH;vy=0;}
function act(){
  const now=performance.now();
  if(state==='ready'){reset();state='run';vy=-14;}
  else if(state==='over'){if(now-deadAt>400){reset();state='run';}}
  else if(cy>=GY-CH-1){vy=-14;}
}
addEventListener('pointerdown',e=>{act();});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)act();}});

function spawn(){
  const n=score>150&&Math.random()<.45?(Math.random()<.4?3:2):1;
  for(let i=0;i<n;i++){
    eggs.push({x:W+20+i*25,w:24,h:30+Math.random()*8,c:COLORS[Math.floor(Math.random()*COLORS.length)],k:Math.floor(Math.random()*3)});
  }
}
function hit(){
  const a={x:CX+9,y:cy+8,w:CW-18,h:CH-12};
  return eggs.some(e=>{const b={x:e.x+4,y:GY-e.h+6,w:e.w-8,h:e.h-6};
    return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;});
}
function update(dt){
  clouds.forEach(c=>{c.x-=(state==='run'?speed*.15:.2)*dt;if(c.x<-80)c.x=W+60+Math.random()*100;});
  if(state!=='run')return;
  speed=Math.min(13,speed+0.0025*dt);
  score+=speed*dt*0.1;
  vy+=0.8*dt;cy+=vy*dt;
  if(cy>=GY-CH){cy=GY-CH;vy=0;}
  frame+=dt*speed*0.04;
  eggs.forEach(e=>e.x-=speed*dt);
  eggs=eggs.filter(e=>e.x>-60);
  tufts.forEach(t=>{t.x-=speed*dt;if(t.x<-10)t.x+=W+Math.random()*200+20;});
  since+=speed*dt;
  if(since>=gap){spawn();since=0;gap=speed*(28+Math.random()*30)+160;}
  if(hit()){state='over';deadAt=performance.now();
    const s=Math.floor(score);
    if(s>best){best=s;try{localStorage.setItem('kotaBest',String(best))}catch(e){}}}
}

function drawChicken(x,y,dead){
  ctx.save();ctx.translate(x,y);
  const air=cy<GY-CH-1;
  const ph=air?0:Math.floor(frame)%2;
  ctx.strokeStyle='#F29A2E';ctx.lineWidth=3;ctx.lineCap='round';
  [[14,ph?-4:4],[26,ph?4:-4]].forEach(([lx,o])=>{
    ctx.beginPath();ctx.moveTo(lx,38);ctx.lineTo(lx+(air?3:o),CH);ctx.stroke();});
  ctx.fillStyle='#F2B91C';
  ctx.beginPath();ctx.moveTo(6,24);ctx.lineTo(-6,12);ctx.lineTo(-2,28);ctx.lineTo(-6,34);ctx.lineTo(8,34);ctx.closePath();ctx.fill();
  ctx.fillStyle='#FFD83D';
  ctx.beginPath();ctx.ellipse(20,29,18,13,0,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(32,15,10,0,7);ctx.fill();
  ctx.fillStyle='#F5BE1F';
  ctx.beginPath();ctx.ellipse(17,30,9,6,-.2,0,7);ctx.fill();
  ctx.fillStyle='#E8433B';
  [[27,6,4],[33,4,4.5],[38,7,3.5]].forEach(([a,b,r])=>{ctx.beginPath();ctx.arc(a,b,r,0,7);ctx.fill();});
  ctx.beginPath();ctx.arc(39,24,3.2,0,7);ctx.fill();
  ctx.fillStyle='#F29A2E';
  ctx.beginPath();ctx.moveTo(41,13);ctx.lineTo(50,17);ctx.lineTo(41,21);ctx.closePath();ctx.fill();
  ctx.fillStyle='#2B2118';
  if(dead){ctx.font='700 10px sans-serif';ctx.fillText('x',32,17);}
  else{ctx.beginPath();ctx.arc(34,13,1.9,0,7);ctx.fill();}
  ctx.restore();
}
function drawEgg(e){
  const cx=e.x+e.w/2,cyy=GY-e.h/2+2;
  ctx.save();
  ctx.beginPath();ctx.ellipse(cx,cyy,e.w/2,e.h/2,0,0,7);
  ctx.fillStyle=e.c;ctx.fill();ctx.clip();
  ctx.fillStyle='rgba(255,255,255,.8)';
  if(e.k===0){ctx.fillRect(e.x,cyy-3,e.w,6);}
  else if(e.k===1){ctx.beginPath();ctx.moveTo(e.x,cyy);for(let i=0;i<=4;i++)ctx.lineTo(e.x+i*e.w/4,cyy+(i%2?5:-5));ctx.lineTo(e.x+e.w,cyy+9);ctx.lineTo(e.x,cyy+9);ctx.fill();}
  else{[[-5,-6],[4,-2],[-3,6],[5,8]].forEach(([a,b])=>{ctx.beginPath();ctx.arc(cx+a,cyy+b,2.4,0,7);ctx.fill();});}
  ctx.restore();
  ctx.strokeStyle='rgba(60,40,20,.25)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.ellipse(cx,cyy,e.w/2,e.h/2,0,0,7);ctx.stroke();
}

function drawLogo(){
  if(!logoOk)return;
  const h=44,w=h*logoImg.naturalWidth/logoImg.naturalHeight,x=12,y=10,r=8;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();ctx.clip();
  ctx.drawImage(logoImg,x,y,w,h);
  ctx.restore();
}
function centerText(t,y,size,col){ctx.font='700 '+size+'px Fredoka,system-ui,sans-serif';ctx.textAlign='center';ctx.fillStyle=col;ctx.fillText(t,W/2,y);}

function draw(){
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.fillStyle='#BFE6FA';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#FFD966';ctx.beginPath();ctx.arc(W-70,60,26,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.85)';
  clouds.forEach(c=>{ctx.beginPath();ctx.ellipse(c.x,c.y,28*c.s,10*c.s,0,0,7);ctx.ellipse(c.x+16*c.s,c.y-7*c.s,16*c.s,10*c.s,0,0,7);ctx.fill();});
  ctx.fillStyle='#7DBB5A';ctx.fillRect(0,GY,W,10);
  ctx.fillStyle='#B88A56';ctx.fillRect(0,GY+10,W,H-GY-10);
  ctx.fillStyle='#9C7343';tufts.forEach(t=>ctx.fillRect(t.x,t.y,8,3));
  eggs.forEach(drawEgg);
  drawChicken(CX,cy,state==='over');
  drawLogo();
  ctx.textAlign='right';ctx.font='700 17px Fredoka,system-ui,sans-serif';ctx.fillStyle='#5A4527';
  ctx.fillText('Ρεκόρ '+pad(best)+'   Σκορ '+pad(score),W-14,28);
  if(state==='ready'){centerText('Άγγιξε για να πηδήξεις',130,26,'#5A4527');}
  if(state==='over'){
    ctx.fillStyle='rgba(191,230,250,.8)';ctx.fillRect(0,80,W,100);
    centerText('Πάτησες αυγό!',122,28,'#B5382F');
    centerText('Άγγιξε για να ξαναπαίξεις',156,18,'#5A4527');
  }
}
function loop(t){
  const dt=Math.min(2.5,(t-(last||t))/16.667);last=t;
  update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
